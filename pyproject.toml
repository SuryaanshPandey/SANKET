[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clarity"
version = "1.10.3"
description = "Evidence-grade document information extraction platform using a local multimodal VLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "boto3>=1.34.0",
    "opencv-python-headless>=4.10.0",
    "pillow>=10.4.0",
    "numpy>=1.26.0",
    "openai>=1.40.0",
    "rich>=13.7.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[project.scripts]
clarity = "clarity.cli:main"

[tool.setuptools.packages.find]
include = ["clarity*"]
exclude = ["tests*", "samples*", "frontend*", "migrations*"]
